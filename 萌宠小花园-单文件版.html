<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>萌宠小花园</title>
<style>
/* ==========================================================
 *  萌宠小花园 · 样式（手绘绘本 / 纸质手帐风）
 * ========================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --ink: #5B4636; --line: #6B4F3A;
  --paper: #F6F0DC; --paper2: #FBF7E8; --desk: #E3D9BC;
  --green: #B9CFA0; --dgreen: #6F9460; --coral: #EBAE9C; --dcoral: #D9826A;
  --yellow: #EBC66B; --pink: #EBB0A6; --blue: #A9CDD9; --purple: #CBBBDD;
  --r1: 26px 40px 24px 44px / 40px 24px 44px 26px;
  --r2: 22px 200px 20px 230px / 220px 20px 210px 22px;
  --r3: 14px 20px 12px 22px / 20px 12px 22px 14px;
  --sh: 2px 3px 0 rgba(107, 79, 58, .28);
  --grow: 1;
}
html, body { height: 100%; overflow: hidden; }
body {
  height: 100dvh;
  font-family: "LXGW WenKai", "霞鹜文楷", "STKaiti", "KaiTi", "楷体", "Kaiti SC", "PingFang SC", "Microsoft YaHei", serif;
  font-size: 17px; color: var(--ink); background: var(--desk);
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input { font: inherit; color: inherit; }
svg.ic { width: 1.5em; height: 1.5em; display: inline-block; vertical-align: -0.38em; overflow: visible; flex: none; }
i[data-ic] { font-style: normal; display: inline-flex; }
#svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { height: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); box-shadow: 0 0 0 2.5px var(--line), 0 0 40px rgba(91, 70, 54, .25); position: relative; overflow: hidden; }
.screen { display: none; flex: 1; min-height: 0; flex-direction: column; position: relative; }
.screen.active { display: flex; }
/* 整个画面蒙一层纸纹 */
#grain { position: fixed; inset: 0; pointer-events: none; z-index: 95; mix-blend-mode: multiply; opacity: .75;
  background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='5'/%3E%3CfeColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .24  0 0 0 .7 -.2'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23g)'/%3E%3C/svg%3E"); }

/* ---------- 按钮 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 24px; border: 2.5px solid var(--line); border-radius: var(--r1); font-size: 19px; font-weight: bold; color: var(--ink); background: var(--yellow); box-shadow: var(--sh); transition: transform .08s, box-shadow .08s; white-space: nowrap; }
.btn:active { transform: translate(2px, 3px); box-shadow: none; }
.btn.green { background: var(--green); } .btn.coral { background: var(--coral); } .btn.plain { background: var(--paper2); }
.btn.gray { background: #E4DCC8; color: #9A8B78; border-color: #B5A792; box-shadow: none; }
.btn.big { font-size: clamp(20px, 4.4vw, 25px); padding: 11px 34px; }
.btn.small { font-size: 15px; padding: 4px 13px; border-width: 2px; }
.btn:disabled { pointer-events: none; }

/* ---------- 封面 ---------- */
#screen-title { overflow: hidden; }
.title-bg { position: absolute; inset: 0; }
.title-bg svg { width: 100%; height: 100%; display: block; }
.title-inner { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.4vh, 22px); padding: 20px; text-align: center; }
.logo { font-size: clamp(46px, 11.5vw, 94px); line-height: 1.1; letter-spacing: .06em; font-weight: bold; }
.logo span { display: inline-block; color: var(--c); -webkit-text-stroke: 2.5px var(--line); paint-order: stroke fill; text-shadow: 3px 4px 0 rgba(107, 79, 58, .22); animation: logoBob 3.4s ease-in-out infinite; }
.logo span:nth-child(1) { --c: #EBAE9C; } .logo span:nth-child(2) { --c: #EBC66B; animation-delay: .25s; }
.logo span:nth-child(3) { --c: #B9CFA0; animation-delay: .5s; } .logo span:nth-child(4) { --c: #A9CDD9; animation-delay: .75s; }
.logo span:nth-child(5) { --c: #CBBBDD; animation-delay: 1s; }
.slogan { font-size: clamp(14px, 3.2vw, 19px); background: var(--paper2); border: 2px solid var(--line); border-radius: var(--r1); padding: 4px 18px; transform: rotate(-1deg); }
.title-pets { display: flex; justify-content: center; align-items: flex-end; gap: clamp(0px, 1vw, 8px); width: 100%; max-width: 720px; }
.tp { flex: 1; max-width: 118px; min-width: 0; animation: breathe 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
.tp svg { width: 100%; display: block; overflow: visible; }
.title-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.foot { font-size: 14px; opacity: .8; }

/* ---------- 选宠物 ---------- */
#screen-choose { padding: 18px 14px 22px; gap: 14px; align-items: center; overflow: auto; }
#screen-choose::before, #screen-choose::after { content: ""; flex: 1; }
.choose-title { font-size: clamp(21px, 4.8vw, 30px); text-align: center; }
.choose-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 640px; }
@media (min-width: 700px) { .choose-grid { grid-template-columns: repeat(5, 1fr); max-width: 860px; } }
.pcard { background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r3); padding: 8px 6px 10px; text-align: center; transition: transform .15s; box-shadow: var(--sh); }
.pcard:nth-child(odd) { transform: rotate(-1deg); } .pcard:nth-child(even) { transform: rotate(1deg); }
.pcard .pp { width: min(68%, 13dvh); margin: 0 auto; }
.pcard .pp svg { width: 100%; display: block; overflow: visible; }
.pcard b { display: block; font-size: 20px; }
.pcard small { font-size: 13px; opacity: .8; }
.pcard.sel { background: #FBEFC4; transform: translateY(-5px) rotate(0) scale(1.04); box-shadow: 3px 6px 0 rgba(107, 79, 58, .3); }
.pcard.sel .pp { animation: hop .9s ease-in-out infinite; transform-origin: 50% 100%; }
.choose-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; font-weight: bold; }
.choose-form input, .text-input { border: 2.5px solid var(--line); border-radius: var(--r1); padding: 8px 16px; width: 150px; font-size: 19px; text-align: center; background: var(--paper2); outline: none; user-select: text; -webkit-user-select: text; }
.text-input { width: 100%; max-width: 300px; }

/* ---------- 顶部状态栏 ---------- */
#hud { padding: 8px 12px; background: var(--paper2); border-bottom: 2.5px solid var(--line); display: flex; flex-direction: column; gap: 7px; z-index: 5; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hud-pet { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hud-avatar { width: 48px; height: 48px; border-radius: 50%; background: #F3E6C4; border: 2.5px solid var(--line); overflow: hidden; flex: none; }
.hud-avatar svg { width: 124%; height: 124%; margin: -2% 0 0 -12%; display: block; }
.hud-name { min-width: 0; white-space: nowrap; }
.hud-name b { font-size: 19px; margin-right: 6px; }
.lv { font-size: 13px; background: var(--green); border: 1.5px solid var(--line); border-radius: var(--r1); padding: 0 9px; }
.lv em { font-style: normal; }
.exp { height: 8px; width: clamp(90px, 24vw, 180px); background: var(--paper); border: 1.5px solid var(--line); border-radius: 5px; margin-top: 5px; overflow: hidden; }
.exp i { display: block; height: 100%; width: 0; background: var(--dcoral); transition: width .4s; }
.hud-right { display: flex; align-items: center; gap: 6px; flex: none; }
.coin { display: flex; align-items: center; gap: 3px; background: #FBEFC4; border: 2px solid var(--line); border-radius: var(--r1); padding: 2px 12px 2px 7px; font-weight: bold; white-space: nowrap; }
.coin.bump { animation: bump .35s; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); position: relative; flex: none; display: flex; align-items: center; justify-content: center; box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); }
.icon-btn svg.ic { width: 26px; height: 26px; vertical-align: 0; }
.icon-btn:active { transform: translate(1px, 2px); box-shadow: none; }
.dot { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: #D9705F; border: 2px solid var(--paper2); display: none; }
.has > .dot { display: block; animation: bump 1.2s infinite; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stat { display: flex; align-items: center; gap: 4px; font-size: 15px; padding: 0 2px; }
.stat svg.ic { width: 22px; height: 22px; vertical-align: 0; }
.stat em { font-style: normal; white-space: nowrap; }
.stat .bar { flex: 1; height: 12px; border: 2px solid var(--line); border-radius: 7px; background: var(--paper); overflow: hidden; }
.stat .bar i { display: block; height: 100%; transition: width .5s; background-image: repeating-linear-gradient(-55deg, rgba(255, 255, 255, .38) 0 3px, transparent 3px 7px); }
.stat[data-k=hunger] .bar i { background-color: #E6A15C; } .stat[data-k=clean] .bar i { background-color: #B7A3CC; } .stat[data-k=thirst] .bar i { background-color: #8FB7CC; }
.stat[data-k=happy] .bar i { background-color: #E08A70; } .stat[data-k=energy] .bar i { background-color: #EBC66B; }
.stat.low .bar { animation: warn 1s infinite; }
@media (max-width: 540px) {
  .stat em, .lv em { display: none; }
  .hud-name { overflow: hidden; } .hud-name b { font-size: 16px; margin-right: 4px; }
  .exp { width: 100%; min-width: 56px; }
  .icon-btn { width: 36px; height: 36px; } .icon-btn svg.ic { width: 23px; height: 23px; }
  .coin { padding: 1px 9px 1px 5px; font-size: 15px; }
  .hud-right { gap: 5px; } .hud-avatar { width: 42px; height: 42px; }
}

/* ---------- 舞台和场景 ---------- */
#stage { flex: 1; min-height: 0; position: relative; overflow: hidden; --u: 1px; --pu: 1px; --stH: 500px; }
.scene { position: absolute; inset: 0; display: none; }
.scene.active { display: block; animation: fadeIn .5s; }
.scene > .bg { position: absolute; inset: 0; }
.scene > .bg svg { width: 100%; height: 100%; display: block; }
.deco { position: absolute; pointer-events: none; }
.deco svg.ic { width: 100%; height: 100%; }
.deco.cloud { width: clamp(70px, 14vw, 130px); height: clamp(70px, 14vw, 130px); opacity: .92; }
.deco.cloud.c1 { left: 8%; top: 2%; animation: cloudMove 46s ease-in-out infinite alternate; }
.deco.cloud.c2 { left: 46%; top: 9%; width: clamp(50px, 10vw, 90px); height: clamp(50px, 10vw, 90px); animation: cloudMove 64s ease-in-out infinite alternate-reverse; }
.deco.kite { right: 46%; top: 4%; width: clamp(44px, 9vw, 74px); height: clamp(44px, 9vw, 74px); animation: kite 7s ease-in-out infinite alternate; transform-origin: 50% 120%; }

/* 小屋 */
.win-sky { fill: #BFDDE3; transition: fill 1.2s; } .win-sun { fill: #F3D98B; transition: fill 1.2s; } .win-hill { fill: #B7CF98; transition: fill 1.2s; }
.win-stars { opacity: 0; transition: opacity 1.2s; }
.night .win-sky { fill: #31406E; } .night .win-sun { fill: #FFF6C9; } .night .win-hill { fill: #3E5A52; } .night .win-stars { opacity: 1; }
.night-mask { position: absolute; inset: 0; background: radial-gradient(circle at 50% 74%, rgba(40, 44, 90, .28), rgba(28, 30, 70, .72)); opacity: 0; pointer-events: none; transition: opacity 1.2s; }
.night .night-mask { opacity: 1; }
.wall-cards .pc { position: absolute; width: calc(var(--u) * 74); padding: 3px 3px 9px; }
.wall-cards .pc::before { content: ""; position: absolute; left: 50%; top: -5px; width: 7px; height: 12px; margin-left: -3px; background: var(--dcoral); border: 1.5px solid var(--line); border-radius: 2px; z-index: 1; }
.pet-zone { position: absolute; left: 50%; bottom: calc(var(--u) * 44); width: calc(var(--pu) * 210 * var(--grow)); margin-left: calc(var(--pu) * -105 * var(--grow)); transition: left 1.8s ease-in-out; }
.pet-zone.gone { opacity: 0; pointer-events: none; transform: translateX(60%); transition: opacity .9s, transform 1s ease-in; }
.pet { width: 100%; aspect-ratio: 1; transform-origin: 50% 100%; cursor: pointer; position: relative; animation: breathe 3s ease-in-out infinite; }
.pet svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.pet .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.6s infinite; }
.pet .wing { transform-box: fill-box; transform-origin: 50% 8%; }
.pet .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.4s ease-in-out infinite alternate; }
.pet.mood-happy { animation: sway 2.6s ease-in-out infinite; }
.pet.mood-joy { animation: hop .55s ease-in-out infinite; }
.pet.mood-sad { animation: droop 3.4s ease-in-out infinite; filter: saturate(.7); }
.pet.mood-sleep { animation: breathe 4.6s ease-in-out infinite; }
.pet.walk { animation: waddle .45s ease-in-out infinite; }
.pet.chomp { animation: chomp .32s ease-in-out 4; }
.pet.trick-spin { transform-origin: 50% 55%; animation: tSpin 1.2s ease-in-out; }
.pet.trick-roll { transform-origin: 50% 55%; animation: tRoll 1.3s ease-in-out; }
.pet.trick-jump { animation: tJump 1.2s ease-in-out; }
.pet.trick-flip { transform-origin: 50% 55%; animation: tFlip 1.2s ease-in-out; }
.pet.flap .wl { animation: flapL .2s ease-in-out 8; } .pet.flap .wr { animation: flapR .2s ease-in-out 8; }
.pet.flap { animation: hop .4s ease-in-out 4; }
.prop { position: absolute; right: -20%; bottom: 2%; width: 36%; opacity: 0; transition: opacity .5s; pointer-events: none; z-index: 2; transform: rotate(8deg); }
.prop.show { opacity: 1; }
.prop svg.ic { width: 100%; height: auto; }
.bubble { position: absolute; left: 50%; bottom: 102%; transform: translateX(-50%) scale(.6); background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r2); padding: 9px 16px; font-size: clamp(15px, 2.7vw, 19px); max-width: min(290px, 74vw); width: max-content; text-align: center; opacity: 0; transition: .25s; pointer-events: none; z-index: 5; line-height: 1.35; box-shadow: var(--sh); }
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -8px; width: 14px; height: 14px; background: var(--paper2); border: solid var(--line); border-width: 0 2.5px 2.5px 0; transform: translateY(-7px) rotate(45deg); }
.bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
.zzz { position: absolute; right: -6%; top: -8%; font-size: calc(var(--pu) * 34); font-weight: bold; color: #FFF6C9; opacity: 0; pointer-events: none; }
.night .zzz { animation: zzz 3s ease-in-out infinite; }
.away-note { position: absolute; left: 50%; bottom: calc(var(--u) * 60); transform: translateX(-50%) rotate(-2deg); background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r3); padding: 14px 20px 12px; text-align: center; line-height: 1.5; box-shadow: 3px 5px 0 rgba(107, 79, 58, .25); display: none; width: max-content; max-width: 86%; }
.away-note.on { display: block; animation: pop .4s; }
.away-note::before { content: ""; position: absolute; left: 50%; top: -12px; width: 86px; height: 22px; margin-left: -43px; background: rgba(235, 198, 107, .8); transform: rotate(-3deg); }
.away-note b { font-size: 20px; } .away-note small { display: block; opacity: .8; font-size: 15px; }
.away-note .sign { text-align: right; font-size: 15px; margin-top: 2px; }
.tub { display: none; position: absolute; left: -14%; width: 128%; bottom: -7%; pointer-events: none; z-index: 2; }
.tub svg { width: 100%; display: block; overflow: visible; }
.bathing .tub { display: block; animation: pop .3s; }
#bath-layer { position: absolute; inset: 0; display: none; touch-action: none; z-index: 4; cursor: grab; overflow: hidden; }
#bath-layer.on { display: block; }
.bath-tip { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r1); padding: 4px 18px; font-weight: bold; white-space: nowrap; }
.bath-bar { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); width: min(60%, 260px); height: 16px; border-radius: 9px; background: var(--paper2); border: 2.5px solid var(--line); overflow: hidden; }
.bath-bar i { display: block; height: 100%; width: 0; background: #A9CDD9; transition: width .15s; }
.bath-x { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; background: var(--paper2); border: 2px solid var(--line); font-size: 22px; line-height: 1; }
.bub { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, rgba(220, 238, 240, .85) 60%, rgba(170, 208, 220, .6)); border: 1.5px solid rgba(107, 79, 58, .45); animation: bubIn .25s; pointer-events: none; }
.rinse .bub { animation: bubOut .8s forwards; }
.drop { position: absolute; width: 4px; height: 16px; border-radius: 3px; background: #8FB7CC; animation: dropFall .45s linear infinite; pointer-events: none; }

/* 底部按钮 */
#actions { display: flex; justify-content: center; gap: clamp(4px, 1.6vw, 14px); padding: 8px 6px 2px; background: var(--paper2); border-top: 2.5px solid var(--line); }
#actions.hide { display: none; }
.act { display: flex; flex-direction: column; align-items: center; font-size: 15px; font-weight: bold; width: clamp(50px, 14.5vw, 82px); padding: 4px 0 4px; border: 2px solid var(--line); border-radius: var(--r3); background: var(--paper); box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); }
.act svg.ic { width: clamp(26px, 6vw, 34px); height: clamp(26px, 6vw, 34px); vertical-align: 0; }
.act em { font-style: normal; white-space: nowrap; }
.act:active { transform: translate(1px, 2px); box-shadow: none; }
.act:nth-child(odd) { transform: rotate(-1.2deg); } .act:nth-child(even) { transform: rotate(1.2deg); }
.act.off { opacity: .45; }
#nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 7px 8px calc(7px + env(safe-area-inset-bottom)); background: var(--paper2); }
#actions.hide + #nav { border-top: 2.5px solid var(--line); }
#nav button { display: flex; flex-direction: column; align-items: center; font-size: 15px; font-weight: bold; padding: 3px 0 2px; border-radius: var(--r3); border: 2px solid transparent; opacity: .62; transition: .15s; position: relative; }
#nav button svg.ic { width: 28px; height: 28px; vertical-align: 0; }
#nav button.on { opacity: 1; background: #FBEFC4; border-color: var(--line); transform: translateY(-2px) rotate(-1deg); box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); }
#nav .dot { right: 18%; top: -2px; }

/* 花园 */
.garden-tip { position: absolute; top: 8px; left: 50%; transform: translateX(-50%) rotate(-.6deg); background: var(--paper2); border: 2px solid var(--line); border-radius: var(--r1); padding: 3px 16px; font-size: 15px; white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
.garden-wrap { position: absolute; left: 0; right: 0; bottom: 2.5%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 10px; }
.g-row { display: flex; align-items: flex-end; justify-content: center; gap: clamp(10px, 5vw, 46px); width: 100%; }
.pet.small { width: clamp(60px, calc(var(--stH) * .2), 120px); flex: none; }
.mailbox { width: clamp(40px, calc(var(--stH) * .13), 76px); flex: none; position: relative; }
.mailbox svg, .guest svg { width: 100%; display: block; overflow: visible; }
.mailbox.has { animation: nudge 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
.guest { width: clamp(56px, calc(var(--stH) * .17), 104px); flex: none; position: relative; }
.guest .friend { position: absolute; left: 12%; bottom: 62%; width: 76%; animation: breathe 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.guest .tag { position: absolute; left: 50%; bottom: 215%; transform: translateX(-50%); background: var(--paper2); border: 2px solid var(--line); border-radius: var(--r1); font-size: 13px; padding: 0 9px; white-space: nowrap; animation: bump 1.4s infinite; }
.plots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: min(100%, 500px, calc(var(--stH) * .86)); }
.plot { position: relative; aspect-ratio: 1 / .9; border-radius: var(--r3); border: 2.5px dashed transparent; }
.plot.empty { background: rgba(255, 253, 246, .28); border-color: rgba(107, 79, 58, .45); }
.plot:active { transform: scale(.96); }
.plot .soil { position: absolute; left: 8%; right: 8%; bottom: 9%; height: 32%; border-radius: 50%; background: #B8946A; border: 2.5px solid var(--line); transition: background .4s; }
.plot.wet .soil { background: #8E6C49; }
.plot .plant { position: absolute; left: 50%; bottom: 24%; width: 62%; transform: translateX(-50%); pointer-events: none; }
.plot .plant svg { width: 100%; display: block; overflow: visible; animation: plantSway 3.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.plot .plus { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: clamp(24px, 6vw, 36px); color: var(--line); opacity: .55; font-weight: bold; }
.plot .crop { position: absolute; left: 50%; top: 0; width: 46%; transform: translateX(-50%); animation: cropBob 1.4s ease-in-out infinite; pointer-events: none; }
.plot .crop svg.ic { width: 100%; height: auto; }
.plot .thirst { position: absolute; right: 4%; top: 4%; width: 28%; background: var(--paper2); border: 2px solid var(--line); border-radius: 50%; padding: 2px; animation: bump 1.2s infinite; display: flex; }
.plot .thirst svg.ic { width: 100%; height: auto; }
.plot .grow { position: absolute; left: 14%; right: 14%; bottom: 2.5%; height: 8px; border-radius: 5px; background: var(--paper2); border: 1.5px solid var(--line); overflow: hidden; }
.plot .grow i { display: block; height: 100%; width: 0; background: #9DBB7A; transition: width .9s linear; }
.plot .tag { position: absolute; bottom: 1%; left: 50%; transform: translateX(-50%); background: var(--yellow); border: 2px solid var(--line); border-radius: var(--r1); font-size: 14px; padding: 0 12px; font-weight: bold; white-space: nowrap; }

/* 游乐场、商店、手帐的纸面板 */
.panel { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); width: min(94%, 740px); max-height: 84%; overflow: auto; background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r3); padding: 14px; box-shadow: 3px 5px 0 rgba(107, 79, 58, .22); }
.panel h2 { text-align: center; font-size: 20px; margin-bottom: 10px; }
.game-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.gcard { border: 2.5px solid var(--line); border-radius: var(--r3); padding: 10px 8px; text-align: center; box-shadow: var(--sh); }
.gcard:nth-child(odd) { transform: rotate(-1deg); } .gcard:nth-child(even) { transform: rotate(1deg); }
.gcard:active { transform: translate(2px, 3px); box-shadow: none; }
.gcard svg.ic { width: 46px; height: 46px; display: block; margin: 0 auto 2px; }
.gcard b { font-size: 18px; display: block; }
.gcard small { font-size: 13px; opacity: .85; }
.tabs { display: flex; gap: 7px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
.tab { padding: 3px 15px; border: 2px solid var(--line); border-radius: var(--r1); background: var(--paper); font-weight: bold; white-space: nowrap; opacity: .7; }
.tab.on { background: var(--green); opacity: 1; box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(106px, 1fr)); gap: 10px; }
.sitem { background: var(--paper); border-radius: var(--r3); padding: 8px 6px 10px; text-align: center; border: 2px solid var(--line); }
.sitem svg.ic.big, .item svg.ic.big, .souv svg.ic.big { width: 44px; height: 44px; display: block; margin: 0 auto; }
.sitem b { display: block; font-size: 16px; }
.sitem small { display: block; font-size: 13.5px; opacity: .8; min-height: 16px; }
.sitem .btn { margin-top: 6px; }
#scene-album { background: #E9DFC2; }
.panel.album { top: 3%; max-height: none; scrollbar-width: thin; }
.pc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px 12px; padding: 4px; }
.pc { display: block; background: #FFFDF6; border: 1.5px solid rgba(107, 79, 58, .55); padding: 5px 5px 4px; box-shadow: 2px 3px 7px rgba(91, 70, 54, .25); text-align: center; position: relative; }
.pc:nth-child(3n+1) { transform: rotate(-1.6deg); } .pc:nth-child(3n+2) { transform: rotate(1.2deg); } .pc:nth-child(3n) { transform: rotate(-.6deg); }
.pc .img { aspect-ratio: 3 / 2; overflow: hidden; background: #EFE6CC; display: block; }
.pc .img svg { width: 100%; height: 100%; display: block; }
.pc .cap { display: block; font-size: 14px; line-height: 1.5; white-space: nowrap; overflow: hidden; }
.pc.rare::after { content: "珍"; position: absolute; right: -6px; top: -8px; width: 26px; height: 26px; line-height: 23px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--line); font-size: 14px; font-weight: bold; transform: rotate(12deg); }
.pc.lock .img { display: flex; align-items: center; justify-content: center; font-size: 30px; color: #B5A792; border: 2px dashed #C9BC9F; background: none; }
.pc.lock { box-shadow: none; opacity: .75; }
.pc.big { width: min(100%, 420px); margin: 0 auto 10px; padding: 9px 9px 6px; transform: rotate(-1deg); }
.pc.big .cap { font-size: 18px; }
.souv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.souv { background: var(--paper); border: 2px solid var(--line); border-radius: var(--r3); padding: 8px 4px; text-align: center; font-size: 14px; }
.souv small { display: block; opacity: .75; font-size: 12.5px; }
.souv.lock { opacity: .5; border-style: dashed; }
.souv.tip { border-style: dashed; background: #FBEFC4; }
.souv.lock svg.ic { filter: grayscale(1) brightness(1.15); opacity: .5; }
.album-note { text-align: center; font-size: 14.5px; opacity: .8; margin: 2px 0 10px; }

/* ---------- 弹窗 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(91, 70, 54, .45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 18px 16px; animation: fadeIn .2s; }
.modal { background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r3); padding: 24px 18px 18px; width: 100%; max-width: 460px; max-height: 88dvh; overflow: auto; box-shadow: 4px 7px 0 rgba(91, 70, 54, .3); animation: pop .28s; text-align: center; position: relative; }
.modal h2 { font-size: 22px; margin-bottom: 10px; padding: 0 30px; }
.modal h3 { font-size: 17px; margin: 12px 0 8px; text-align: left; border-bottom: 2px dashed rgba(107, 79, 58, .4); padding-bottom: 2px; }
.modal p { line-height: 1.6; margin-bottom: 10px; }
.modal .x { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); font-size: 22px; line-height: 1; }
.modal .hero { width: 96px; margin: 0 auto 4px; animation: hop 1.2s ease-in-out infinite; transform-origin: 50% 100%; }
.modal .hero svg { width: 100%; height: auto; display: block; overflow: visible; }
.modal .hint { font-size: 14px; opacity: .78; margin-top: 10px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.empty { opacity: .85; }
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 9px; }
.item { background: var(--paper); border-radius: var(--r3); padding: 7px 4px; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; }
.item:active { transform: scale(.95); }
.item.sel { background: #FBEFC4; box-shadow: var(--sh); transform: rotate(-1.5deg); }
.item b { font-size: 15.5px; }
.item small { font-size: 13px; opacity: .8; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { background: var(--paper); border: 2px solid var(--line); border-radius: var(--r1); padding: 2px 12px; font-size: 15px; }
.task { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 2px solid var(--line); border-radius: var(--r3); padding: 7px 10px; margin-bottom: 8px; text-align: left; }
.task svg.ic { width: 30px; height: 30px; }
.task .t-mid { flex: 1; min-width: 0; font-size: 15.5px; font-weight: bold; }
.task .t-bar { height: 8px; background: var(--paper2); border: 1.5px solid var(--line); border-radius: 5px; margin-top: 4px; overflow: hidden; }
.task .t-bar i { display: block; height: 100%; background: #9DBB7A; }
.gift-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin: 6px 0 10px; font-weight: bold; }
.gift-list span { display: inline-flex; align-items: center; gap: 4px; }
.gift-list svg.ic { width: 30px; height: 30px; }
.new-tag { background: #D9705F; color: #fff; font-size: 12px; border-radius: 8px; padding: 0 6px; margin-left: 2px; }

/* ---------- 小游戏 ---------- */
.game-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(91, 70, 54, .5); display: none; align-items: center; justify-content: center; padding: 10px; }
.game-overlay.on { display: flex; }
.game-box { width: 100%; max-width: 900px; height: min(100%, 680px); background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r3); display: flex; flex-direction: column; overflow: hidden; animation: pop .28s; box-shadow: 4px 7px 0 rgba(91, 70, 54, .3); }
.game-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--green); border-bottom: 2.5px solid var(--line); font-weight: bold; }
#g-title { font-size: 18px; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
#g-info { flex: 1; text-align: center; font-size: 17px; white-space: nowrap; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 4px; }
#g-info svg.ic { width: 22px; height: 22px; vertical-align: 0; }
.g-close { width: 34px; height: 34px; border-radius: 50%; background: var(--paper2); border: 2px solid var(--line); flex: none; font-size: 22px; line-height: 1; }
.game-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.game-body canvas { display: block; touch-action: none; cursor: pointer; }
.g-panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; }
.g-big { width: clamp(64px, 16dvh, 104px); animation: hop 1.2s infinite; transform-origin: 50% 100%; }
.g-big svg { width: 100%; height: auto; display: block; overflow: visible; }
.g-panel h2 { font-size: clamp(21px, 5vw, 27px); }
.g-panel p { max-width: 440px; line-height: 1.6; }
.g-reward { font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 4px; justify-content: center; }
.mem-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 460px, calc(100dvh - 120px)); }
.mem { aspect-ratio: 1; border: 2.5px solid var(--line); border-radius: var(--r3); background: var(--coral); box-shadow: var(--sh); font-size: clamp(22px, 7vw, 38px); font-weight: bold; color: var(--paper2); padding: 8%; }
.mem .mb { display: none; width: 100%; height: 100%; }
.mem .mb svg { width: 100%; height: 100%; display: block; overflow: visible; }
.mem.open { background: var(--paper); animation: flip .25s; }
.mem.open .mf { display: none; } .mem.open .mb { display: block; }
.mem.done { background: #DCE8C8; animation: bump .4s; }
.mel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px; }
.mel-pet { width: min(150px, 22dvh); }
.mel-pet svg, .math-pet svg { width: 100%; height: auto; display: block; overflow: visible; }
.mel-msg { font-size: 19px; font-weight: bold; background: var(--paper); border: 2px solid var(--line); border-radius: var(--r1); padding: 3px 20px; }
.mel-pads { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: min(100%, 380px); }
.pad { aspect-ratio: 1.6; border: 2.5px solid var(--line); border-radius: var(--r3); font-size: 24px; font-weight: bold; box-shadow: var(--sh); opacity: .8; transition: transform .08s; }
.pad.lit { opacity: 1; transform: scale(1.07) rotate(-2deg); filter: brightness(1.12); box-shadow: 0 0 0 5px var(--paper2), 0 0 0 7.500px var(--line); }
.p0 { background: var(--coral); } .p1 { background: var(--yellow); } .p2 { background: var(--green); } .p3 { background: var(--blue); }
@media (max-height: 560px) { .mel-pads { grid-template-columns: repeat(4, 1fr); width: min(100%, 560px); } .pad { aspect-ratio: 1.2; font-size: 19px; } }
.math { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 14px; }
.math-top { display: flex; align-items: center; gap: 12px; }
.math-pet { width: min(120px, 20dvh); flex: none; }
.math-q { font-size: clamp(32px, 9vw, 54px); font-weight: bold; background: var(--paper); border: 2.5px solid var(--line); border-radius: var(--r2); padding: 6px 26px; white-space: nowrap; }
.math-opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: min(100%, 400px); }
.opt { padding: clamp(6px, 2dvh, 12px) 0; font-size: 29px; font-weight: bold; border: 2.5px solid var(--line); border-radius: var(--r3); background: var(--paper); box-shadow: var(--sh); }
.opt.right { background: #C9DDB0; } .opt.wrong { background: #EBB0A6; animation: shake .3s; }
@media (max-height: 520px) { .math-opts { grid-template-columns: repeat(4, 1fr); width: min(100%, 600px); } }

/* ---------- 特效层 ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.fx-float { position: absolute; font-size: 21px; font-weight: bold; color: var(--ink); text-shadow: 0 2px 0 var(--paper2), 0 -1px 0 var(--paper2), 1px 0 0 var(--paper2), -1px 0 0 var(--paper2); animation: floatUp 1.2s ease-out forwards; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
.fx-float svg.ic { width: 30px; height: 30px; vertical-align: 0; }
.fx-fly { position: absolute; left: 0; top: 0; width: 40px; height: 40px; }
.fx-fly svg.ic { width: 100%; height: 100%; }
.confetti { position: absolute; top: -24px; width: 10px; height: 15px; border-radius: 2px; border: 1.5px solid var(--line); animation: confetti linear forwards; }
.can { position: absolute; width: 60px; transform-origin: 70% 80%; animation: pour 1.1s ease-in-out forwards; }
.can svg.ic { width: 100%; height: auto; display: block; }
.wdrop { position: absolute; width: 5px; height: 10px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #8FB7CC; border: 1px solid var(--line); opacity: 0; animation: wfall .5s ease-in forwards; }
#toast { position: fixed; left: 50%; top: 23%; transform: translate(-50%, -20px) rotate(-.6deg); background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r1); padding: 6px 22px; font-size: 17px; font-weight: bold; opacity: 0; transition: .25s; pointer-events: none; z-index: 90; max-width: 92vw; text-align: center; box-shadow: var(--sh); }
#toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-.6deg); }
#banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0) rotate(-2deg); z-index: 85; background: var(--yellow); border: 3px solid var(--line); border-radius: var(--r2); font-size: clamp(22px, 6vw, 36px); font-weight: bold; padding: 14px 34px; pointer-events: none; transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); text-align: center; white-space: nowrap; box-shadow: 4px 7px 0 rgba(91, 70, 54, .3); }
#banner.show { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }

/* ---------- 动画 ---------- */
@keyframes fadeIn { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.75); opacity: 0; } 70% { transform: scale(1.03); } }
@keyframes bump { 50% { transform: scale(1.16); } }
@keyframes nudge { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-7deg); } 20% { transform: rotate(6deg); } 30% { transform: rotate(-4deg); } 40% { transform: rotate(0); } }
@keyframes warn { 50% { background: #F2C4B8; } }
@keyframes cloudMove { to { transform: translateX(90px); } }
@keyframes kite { from { transform: rotate(-9deg) translateY(0); } to { transform: rotate(8deg) translateY(10px); } }
@keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) scale(1.01, .99); } }
@keyframes logoBob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, .975); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1.02, .98); } 45% { transform: translateY(-7%) scale(.98, 1.03); } }
@keyframes waddle { 0%, 100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-3%); } }
@keyframes droop { 0%, 100% { transform: scale(1, .97) rotate(-1.5deg); } 50% { transform: scale(1.01, .95) rotate(1.5deg); } }
@keyframes chomp { 50% { transform: scale(1.06, .92); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes wag { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes flapL { 50% { transform: rotate(48deg); } }
@keyframes flapR { 50% { transform: rotate(-48deg); } }
@keyframes tSpin { to { transform: rotate(720deg); } }
@keyframes tRoll { 30% { transform: translateX(-34%) rotate(-360deg); } 70% { transform: translateX(34%) rotate(360deg); } 100% { transform: translateX(0) rotate(0); } }
@keyframes tJump { 0%, 34%, 68%, 100% { transform: translateY(0) scale(1.06, .92); } 17%, 51%, 85% { transform: translateY(-40%) scale(.95, 1.06); } }
@keyframes tFlip { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-50%) rotate(180deg); } 99.9% { transform: translateY(0) rotate(360deg); } }
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 10px) scale(.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(26px, -44px) scale(1.2); } }
@keyframes bubIn { from { transform: scale(0); } }
@keyframes bubOut { to { transform: translateY(160px) scale(.3); opacity: 0; } }
@keyframes dropFall { from { transform: translateY(-30px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(220px); opacity: 0; } }
@keyframes plantSway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes cropBob { 0%, 100% { transform: translateX(-50%) translateY(0) rotate(-5deg); } 50% { transform: translateX(-50%) translateY(-10%) rotate(5deg); } }
@keyframes flip { from { transform: scaleX(0); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, -50%) scale(.6); } 30% { transform: translate(-50%, -90%) scale(1.1); } to { opacity: 0; transform: translate(-50%, -230%) scale(1); } }
@keyframes confetti { to { transform: translateY(108vh) rotate(720deg); } }
@keyframes pour { 0% { transform: rotate(0); opacity: 0; } 18% { opacity: 1; transform: rotate(-30deg); } 82% { opacity: 1; transform: rotate(-30deg); } 100% { opacity: 0; transform: rotate(0); } }
@keyframes wfall { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(48px); } }
@media (max-width: 540px) {
  .guest .tag { left: auto; right: -12%; transform: none; animation: none; }
  .pc-grid { grid-template-columns: repeat(2, 1fr); gap: 12px 10px; }
  .panel { padding: 12px 10px; }
}

/* ---------- 生病 ---------- */
.ill { font-size: 13px; background: var(--coral); border: 1.5px solid var(--line); border-radius: var(--r1); padding: 0 8px; margin-left: 4px; }
.ill:empty { display: none; }
.pet.mood-cold { animation: shiver .5s ease-in-out infinite; filter: saturate(.8); }
.pet.mood-tummy { animation: droop 2.2s ease-in-out infinite; filter: saturate(.8); }
@keyframes shiver { 0%, 100% { transform: translateX(-1%) scale(1, .98); } 50% { transform: translateX(1%) scale(1, .98); } }

/* ---------- 小游戏等级选择 ---------- */
.lv-label { font-size: 15px; opacity: .8; }
.lv-pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 400px; }
.lv-btn { padding: 3px 14px; border: 2px solid var(--line); border-radius: var(--r1); background: var(--paper); font-weight: bold; opacity: .7; }
.lv-btn.on { background: var(--yellow); opacity: 1; box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); transform: rotate(-1.5deg); }
.gcard .lv-tag { display: inline-block; font-style: normal; font-size: 12.5px; background: var(--paper2); border: 1.5px solid var(--line); border-radius: var(--r1); padding: 0 8px; margin-top: 3px; }
.math-top { flex-wrap: wrap; justify-content: center; }
.math-q.long { font-size: clamp(22px, 5.6vw, 38px); padding: 6px 16px; }
.mem-grid { width: min(100%, 460px, calc((100dvh - 130px) * 4 / var(--rows, 4))); }
@media (max-height: 620px) { .g-panel { gap: 6px; padding: 12px; } .g-panel p { line-height: 1.4; font-size: 15px; } .g-big { width: clamp(44px, 11dvh, 80px); } }

/* ---------- 症状、生病、离家出走的提醒条 ---------- */
#alert { position: absolute; left: 50%; top: 6px; transform: translateX(-50%) rotate(-.4deg); z-index: 6; display: none; align-items: center; justify-content: center; flex-wrap: wrap; gap: 3px 10px; width: max-content; max-width: 96%; background: #FBEFC4; border: 2.5px solid var(--line); border-radius: var(--r3); padding: 5px 12px; font-size: 15px; line-height: 1.35; text-align: center; box-shadow: var(--sh); }
#alert.on { display: flex; }
#alert.bad { background: #F6D5CB; }
#alert b { white-space: nowrap; }
#alert button { border: 2px solid var(--line); border-radius: var(--r1); background: var(--paper2); padding: 1px 12px; font-weight: bold; white-space: nowrap; box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); }
#alert button:active { transform: translate(1px, 2px); box-shadow: none; }
.need { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 2px dashed var(--line); border-radius: var(--r3); padding: 6px 12px; margin-bottom: 8px; text-align: left; }
.need svg.ic { width: 34px; height: 34px; }
.need b { flex: 1; }
.need span { font-size: 14px; opacity: .8; white-space: nowrap; }
.need.ok { border-style: solid; background: #DCE8C8; }
.away-note .row { margin-top: 6px; }
.modal .tabs { margin-bottom: 12px; }
.pet.mood-throat, .pet.mood-fever { animation: droop 2.6s ease-in-out infinite; filter: saturate(.8); }
@media (max-width: 540px) { .stats { gap: 3px; } .stat { gap: 2px; } .stat svg.ic { width: 19px; height: 19px; } #alert { font-size: 14px; padding: 4px 9px; } }

/* ---------- 小屋：三层楼、可以摆放的家具 ---------- */
#scene-home { isolation: isolate; }
#scene-home .bg.f2, #scene-home .bg.f0, #scene-home.floor2 .bg.f1, #scene-home.floor0 .bg.f1 { display: none; }
#scene-home.floor2 .bg.f2, #scene-home.floor0 .bg.f0 { display: block; }
.furn-layer { position: absolute; inset: 0; pointer-events: none; }
.fi { position: absolute; transform: translate(-50%, -100%); pointer-events: none; touch-action: none; }
.fi.wall { transform: translate(-50%, -50%); }
.fi > svg { width: 100%; display: block; overflow: visible; pointer-events: none; }
#scene-home .pet-zone { z-index: 456; }
#scene-home .pet-zone.stair { opacity: 0; transform: translateX(70%); transition: opacity .45s, transform .5s ease-in; pointer-events: none; }
#scene-home .night-mask { z-index: 600; }
#scene-home .away-note { z-index: 650; }
#scene-home #bath-layer { z-index: 700; }
.floor-btn { position: absolute; right: 8px; top: 36%; z-index: 620; display: flex; flex-direction: column; align-items: center; font-size: 14px; font-weight: bold; padding: 3px 8px 2px; background: var(--paper2); border: 2px solid var(--line); border-radius: var(--r3); box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); transform: rotate(1.5deg); }
.floor-btn svg.ic { width: 30px; height: 30px; vertical-align: 0; }
.floor-btn:active { transform: translate(1px, 2px); box-shadow: none; }
.floor-btn.down { top: calc(36% + 62px); }
/* 左边的门牌：写着现在住在哪里，点一下看地图 */
.home-tag { position: absolute; left: 8px; top: 36%; z-index: 620; display: flex; flex-direction: column; align-items: center; font-size: 13px; font-weight: bold; line-height: 1.25; padding: 3px 7px 3px; max-width: 88px; background: var(--paper2); border: 2px solid var(--line); border-radius: var(--r3); box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); transform: rotate(-1.5deg); }
.home-tag svg.ic { width: 28px; height: 28px; vertical-align: 0; }
.home-tag em { font-style: normal; }
.home-tag:active { transform: translate(1px, 2px); box-shadow: none; }
.decor .home-tag { display: none; }
/* 搬家以后窗外的风景；晚上盖一层深蓝 */
.win-dark { fill: #1F2A50; opacity: 0; transition: opacity 1.2s; }
.night .win-dark { opacity: .62; }
/* 家里的其他小伙伴：站在一楼两边，点一下可以换它来陪你 */
.pals { position: absolute; inset: 0; pointer-events: none; z-index: 452; }
.pal { position: absolute; bottom: calc(var(--u) * 58); width: calc(var(--pu) * 104); margin-left: calc(var(--pu) * -52); padding: 0; background: none; border: 0; pointer-events: auto; cursor: pointer; animation: breathe 3.4s ease-in-out infinite; transform-origin: 50% 100%; }
.pal svg { width: 100%; display: block; overflow: visible; pointer-events: none; }
.pal.p0 { left: 9%; } .pal.p1 { left: 91%; animation-delay: -1.2s; }
.pal.p2 { left: 23%; bottom: calc(var(--u) * 72); animation-delay: -2s; } .pal.p3 { left: 77%; bottom: calc(var(--u) * 72); animation-delay: -.6s; }
@media (max-width: 700px) { .pal.p2, .pal.p3 { display: none; } .pal { width: calc(var(--pu) * 84); margin-left: calc(var(--pu) * -42); } .pal.p0 { left: 14%; } .pal.p1 { left: 86%; } }
#scene-home.floor0 .pals, #scene-home.floor2 .pals, .decor .pals { display: none; }
/* 明信片绳上的三个位置：点一下可以换一张 */
.fi .slot { position: absolute; width: 26.600%; pointer-events: auto; cursor: pointer; }
.fi .slot .pc { display: block; padding: 3px; }
.fi .slot .pc .cap { display: none; }
.fi .slot::before { content: ""; position: absolute; left: 50%; top: -5px; width: 7px; height: 12px; margin-left: -3px; background: var(--dcoral); border: 1.5px solid var(--line); border-radius: 2px; z-index: 1; }
.fi .slot.empty { aspect-ratio: 3 / 2.250; border: 2px dashed rgba(107, 79, 58, .5); border-radius: 4px; background: rgba(255, 253, 246, .55); display: flex; align-items: center; justify-content: center; color: var(--line); font-size: calc(var(--u) * 24); font-weight: bold; }
/* 布置模式 */
.decor .fi { pointer-events: auto; cursor: grab; outline: 2px dashed rgba(107, 79, 58, .5); outline-offset: 3px; border-radius: 6px; }
.decor .fi.sel { outline: 3px solid var(--dcoral); }
.decor .fi .slot { pointer-events: none; }
.decor .pet-zone { pointer-events: none; opacity: .5; }
.fi .stow { display: none; position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px; white-space: nowrap; pointer-events: auto; background: var(--yellow); border: 2px solid var(--line); border-radius: var(--r1); padding: 1px 12px; font-size: 14px; font-weight: bold; box-shadow: 1px 2px 0 rgba(107, 79, 58, .25); }
.decor .fi.sel .stow { display: block; }
.decor-bar { display: none; background: var(--paper2); border-top: 2.5px solid var(--line); padding: 6px 8px 4px; align-items: center; gap: 8px; }
#screen-game.decor-on .decor-bar { display: flex; }
#screen-game.decor-on #actions { display: none; }
.modal .pc.on { outline: 3px solid var(--dcoral); outline-offset: 2px; }
.decor-bar .tray { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; align-items: center; min-height: 54px; scrollbar-width: thin; }
.decor-bar .tray button { flex: none; width: 66px; height: 50px; background: var(--paper); border: 2px solid var(--line); border-radius: var(--r3); padding: 4px; }
.decor-bar .tray button svg { width: 100%; height: 100%; display: block; overflow: visible; }
.decor-bar .tip { font-size: 14px; opacity: .85; line-height: 1.3; }
/* 小厨房 */
.pot-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 10px; }
.pot-row .cslot { width: 62px; height: 62px; border: 2.5px dashed var(--line); border-radius: var(--r3); background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--line); }
.pot-row .cslot.full { border-style: solid; background: #FBEFC4; }
.pot-row .cslot svg.ic { width: 46px; height: 46px; vertical-align: 0; }
.pot-row .plus { font-size: 22px; font-weight: bold; }
.pot-row .potic { width: 70px; }
.pot-row .potic svg.ic { width: 100%; height: auto; display: block; }
.cooking .potic { animation: chomp .4s ease-in-out infinite; }
.dish-big { width: 110px; margin: 0 auto; }
.dish-big svg.ic { width: 100%; height: auto; display: block; }
.sitem .thumb { height: 58px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
.sitem .thumb svg { height: 100%; width: auto; max-width: 100%; overflow: visible; }
.sitem .pet-thumb { height: 76px; }
/* 八个按钮：宽屏一排，手机上排成两行 */
#actions { flex-wrap: wrap; }
@media (max-width: 660px) {
  #actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 6px 6px 2px; }
  .act { width: auto; flex-direction: row; justify-content: center; gap: 3px; padding: 3px 0; }
  .act svg.ic { width: 24px; height: 24px; }
  .floor-btn, .home-tag { top: 30%; }
  .floor-btn.down { top: calc(30% + 60px); }
}

/* ---------- 强制休息 ---------- */
#rest { position: fixed; inset: 0; z-index: 94; display: none; align-items: center; justify-content: center; padding: 18px; background: #E9DFC2; }
#rest.on { display: flex; }
.rest-card { background: var(--paper2); border: 2.5px solid var(--line); border-radius: var(--r3); padding: 26px 22px 22px; width: 100%; max-width: 440px; text-align: center; box-shadow: 4px 7px 0 rgba(91, 70, 54, .3); }
.rest-card .hero { width: 120px; margin: 0 auto 6px; }
.rest-card .hero svg { width: 100%; height: auto; display: block; overflow: visible; }
.rest-card h2 { font-size: 26px; margin-bottom: 8px; }
.rest-card p { line-height: 1.6; }
.rest-card .hint { font-size: 14px; opacity: .78; }
.rest-clock { font-size: 58px; font-weight: bold; letter-spacing: .04em; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }

/* ---------- 旅行地图和小车 ---------- */
.modal.wide { max-width: 880px; }
.map-say { font-weight: bold; margin: 0 0 8px; min-height: 1.5em; text-align: center; }
.mapbox { border: 2.5px solid var(--line); border-radius: var(--r3); overflow: auto; background: #BFDDE3; max-height: 66dvh; -webkit-overflow-scrolling: touch; }
.mapin { min-width: 820px; max-width: calc(64dvh * 1.530); margin: 0 auto; }   /* 屏幕够高就整张显示，不够就可以拖着看 */
.mapin svg.map { display: block; width: 100%; height: auto; font-family: inherit; }
.map-pet { transition: transform 1s linear; pointer-events: none; }
.spot { cursor: pointer; }
.shop-note { grid-column: 1 / -1; text-align: center; font-size: 14.5px; opacity: .8; margin: 0 0 2px; }

/* ---------- 新小游戏：消消乐、国际象棋、五子棋 ---------- */
.m3-wrap, .ch-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
.m3-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: min(100%, 440px, calc(100dvh - 150px)); }
.m3 { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; padding: 2px; transition: transform .12s; }
.m3 svg.ic { width: 100%; height: 100%; display: block; }
.m3.sel { transform: scale(1.1); box-shadow: 0 0 0 3px var(--dcoral); z-index: 1; position: relative; }
.m3.gone { animation: m3gone .26s ease-in forwards; }
.m3.drop { animation: m3drop .28s ease-out; }
.m3.no { animation: m3no .3s; }
@keyframes m3gone { to { transform: scale(.1) rotate(40deg); opacity: 0; } }
@keyframes m3drop { from { transform: translateY(-70%); opacity: .2; } }
@keyframes m3no { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.ch-board { display: grid; grid-template-columns: repeat(8, 1fr); width: min(100%, 470px, calc(100dvh - 140px)); border: 2.5px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--sh); }
.ch-sq { aspect-ratio: 1; padding: 1px; border: 0; border-radius: 0; background: #F6EED8; position: relative; }
.ch-sq.dk { background: #C6D7AC; }
.ch-sq svg.ic { width: 100%; height: 100%; display: block; }
.ch-sq.last { box-shadow: inset 0 0 0 3px rgba(224, 138, 112, .75); }
.ch-sq.sel { background: #F3D98B; }
.ch-sq.tgt::after { content: ""; position: absolute; left: 50%; top: 50%; width: 28%; height: 28%; margin: -14% 0 0 -14%; border-radius: 50%; background: rgba(107, 79, 58, .45); }
.ch-sq.tgt.cap::after { width: 84%; height: 84%; margin: -42% 0 0 -42%; background: none; border: 3px solid rgba(217, 112, 95, .85); box-sizing: border-box; }
.gm-board { display: grid; grid-template-columns: repeat(11, 1fr); width: min(100%, 470px, calc(100dvh - 140px)); background: #E9D3A0; border: 2.5px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: var(--sh); }
.gm { aspect-ratio: 1; position: relative; border: 0; padding: 0; border-radius: 0; background: linear-gradient(var(--line), var(--line)) 50% 50% / 100% 1.5px no-repeat, linear-gradient(var(--line), var(--line)) 50% 50% / 1.5px 100% no-repeat; }
.gm i { position: absolute; inset: 9%; border-radius: 50%; border: 2px solid var(--line); background: #FFFDF6; }
.gm.b i { background: #5B4636; }
.gm.new i { box-shadow: 0 0 0 3px rgba(224, 138, 112, .85); }

</style>
</head>

<div id="svg-defs"></div>
<div id="app">

<script>
'use strict';
/* ==========================================================
 *  萌宠小花园 · 插画（手绘绘本风，全部原创 SVG）
 *  画法：棕色铅笔线 + 低饱和水彩色块 + “手抖”滤镜 + 纸纹
 * ========================================================== */

const C = {
  line: '#6B4F3A', cream: '#FBF5E3', paper: '#F4ECD6', white: '#FFFDF6',
  green: '#9DBB7A', lgreen: '#C3D69B', dgreen: '#6F9460', sky: '#BFDDE3', blue: '#8FB7CC',
  pink: '#EBB0A6', coral: '#E08A70', red: '#D9705F', yellow: '#EBC66B', orange: '#E6A15C',
  purple: '#B7A3CC', wood: '#C79F72', dwood: '#A87F56', sand: '#E9D3A0', gray: '#9AA3AD'
};

/* 让线条微微抖动的滤镜（三种粗细）。页面里放一份，单独导出成图片时再各带一份 */
const FILTER_DEFS =
  '<filter id="wob" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>' +
  '<filter id="wob-s" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>' +
  '<filter id="wob-m" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>' +
  '<filter id="wob-l" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>' +
  `<pattern id="hatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 6 h13" stroke="${C.line}" stroke-width="1.1" opacity=".07"/></pattern>`;
const G_OPEN = (f, w) => `<g filter="url(#${f})" stroke="${C.line}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" fill="none">`;

/* ---------- 五官 ---------- */
function _eye(x, y, mood, r) {
  r = r || 6;
  if (mood === 'sleep') return `<path d="M${x - r - 2} ${y} q${r + 2} ${r} ${r * 2 + 4} 0"/>`;
  if (mood === 'joy' || mood === 'eat') return `<path d="M${x - r - 2} ${y + 3} q${r + 2} ${-r * 1.7} ${r * 2 + 4} 0"/>`;
  // 着凉：半睁着的眼睛；肚子疼：疼得眯成 > <
  if (mood === 'cold' || mood === 'fever') return `<path d="M${x - r} ${y - 1} a${r} ${r} 0 0 0 ${r * 2} 0z" fill="${C.line}" stroke-width="2"/>`;
  if (mood === 'tummy') { const s = x < 100 ? 1 : -1; return `<path d="M${x - s * r} ${y - r * .9} L${x + s * r * .7} ${y} L${x - s * r} ${y + r * .9}" stroke-width="3.200"/>`; }
  let s = `<g class="eye" stroke="none"><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.14}" fill="${C.line}"/><circle cx="${x - r * 0.3}" cy="${y - r * 0.42}" r="${r * 0.34}" fill="#fff"/></g>`;
  if (mood === 'sad' || mood === 'throat') {
    const left = x < 100 && mood === 'sad';
    const l = x < 100;
    s += `<path d="M${x - r - 3} ${y - r - (l ? 4 : 10)} L${x + r + 3} ${y - r - (l ? 10 : 4)}" stroke-width="2.6"/>`;
    if (left) s += `<path d="M${x - r} ${y + r + 2} q-5 9 0 12 q5 -3 0 -12z" fill="${C.sky}" stroke-width="1.6"/>`;
  }
  return s;
}
function _blush(x1, x2, y) {
  const one = x => `M${x - 6} ${y + 4} l3 -8 M${x} ${y + 4} l3 -8 M${x + 6} ${y + 4} l3 -8`;
  return `<path d="${one(x1)} ${one(x2)}" stroke="${C.coral}" stroke-width="2.2" opacity=".75"/>`;
}
function _mouth(x, y, mood) {
  if (mood === 'throat') return '';   // 嗓子疼戴着口罩，嘴巴看不见
  if (mood === 'cold' || mood === 'tummy' || mood === 'fever') return `<path d="M${x - 9} ${y + 6} q4.500 -5 9 0 q4.500 5 9 0" stroke-width="2.600"/>`;
  if (mood === 'eat') return `<ellipse cx="${x}" cy="${y + 6}" rx="7" ry="8" fill="#C9705F" stroke-width="2.4"/>`;
  if (mood === 'sad') return `<path d="M${x - 8} ${y + 9} q8 -9 16 0" stroke-width="2.6"/>`;
  if (mood === 'happy' || mood === 'joy') return `<path d="M${x - 9} ${y + 1} q9 14 18 0z" fill="#C9705F" stroke-width="2.4"/>`;
  return `<path d="M${x} ${y} q-5 7 -11 2 M${x} ${y} q5 7 11 2" stroke-width="2.6"/>`;
}

function petInner(type, mood, wear) {

  const e0 = p.eyes[0], e1 = p.eyes[1], cx = (e0 + e1) / 2, ey = p.eyes[2];

  return PET_DRAW[type](mood || 'normal') + (wear ? wearSVG(wear, p) : '') + extra;

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"${forImage ? ` width="240" height="240"><defs>${FILTER_DEFS}</defs>` : '>'}` +

/* ---------- 花园里的植物、水壶、浴缸 ---------- */
function plantSVG(st) {
  const leaf = (x, y, s, flip) => `<path transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})" d="M0 0 q-16 -3 -19 -17 q17 1 19 17z" fill="${C.green}"/>`;
  const stem = h => `<path d="M30 78 v-${h}" stroke="${C.dgreen}" stroke-width="3.500"/>`;
  let b;
  if (st === 's0') b = stem(9) + leaf(30, 70, .5) + leaf(30, 70, .5, 1);
  else if (st === 's1') b = stem(28) + leaf(30, 62, .85) + leaf(30, 56, .85, 1);
  else if (st === 's2') b = stem(46) + leaf(30, 66, .95) + leaf(30, 58, .95, 1) + leaf(30, 46, .7) + leaf(30, 42, .7, 1) + `<circle cx="30" cy="27" r="8" fill="${C.lgreen}"/>`;
  else b = stem(40) + leaf(30, 66, 1) + leaf(30, 58, 1, 1) + leaf(30, 48, .75) + leaf(30, 44, .75, 1);
  return `<svg viewBox="0 0 60 80">${G_OPEN('wob-s', 2)}${b}</g></svg>`;
}

/* ---------- 场景背景（800×500，纯静态；会动的东西放在页面里单独叠上去） ---------- */
const _SCENE_OPEN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 784 484" preserveAspectRatio="xMidYMax slice">';
const _grass = pts => `<path d="${pts.map(p => `M${p[0]} ${p[1]} l-4 -10 M${p[0]} ${p[1]} l0 -13 M${p[0]} ${p[1]} l4 -10`).join(' ')}" stroke="${C.dgreen}" stroke-width="2.200"/>`;
const _flower = (x, y, c) => `<path d="M${x} ${y} v14" stroke="${C.dgreen}" stroke-width="2.200"/><circle cx="${x}" cy="${y}" r="6" fill="${c}" stroke-width="2"/>`;
function _bunting(x1, x2, y0, sag, colors) {
  let s = `<path d="M${x1} ${y0} Q${(x1 + x2) / 2} ${y0 + sag * 2} ${x2} ${y0}" stroke-width="2"/>`;
  const n = Math.round((x2 - x1) / 70);
  for (let i = 0; i < n; i++) {
    const t = (i + .5) / n, x = x1 + (x2 - x1) * t, y = y0 + sag * 4 * t * (1 - t);
    s += `<path d="M${x - 14} ${y} L${x + 14} ${y} L${x} ${y + 26}Z" fill="${colors[i % colors.length]}" stroke-width="2"/>`;
  }
  return s;
}

/* cardId 形如 "sea:a"（普通）或 "sea:b"（稀有） */
function postcardSVG(cardId, petType, wear) {
  const p = cardId.split(':'), d = DESTS[p[0]], rare = p[1] === 'b';

  const pos = d.pet;
  const petG = `<g transform="translate(${pos[0]} ${pos[1]}) scale(${pos[2]})" stroke-width="${(2.4 / pos[2]).toFixed(1)}">${petInner(petType, 'joy', wear)}</g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 292 192" preserveAspectRatio="xMidYMid slice">${G_OPEN('wob-m', 2.4)}` +
    CARD_BG[p[0]](rare) + petG + (CARD_BG[p[0] + 'Front'] ? CARD_BG[p[0] + 'Front']() : '') + '</g></svg>';
}

/* 从家（from，不写就是老家）到某个地方的那条弯弯的路；u 从 0（家）到 1（目的地），返回路上的那个点 */
function mapRoute(to, from) {
  const a = from || MAP_HOME, b = to, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1];
  const c = [mx - dy * .18, my + dx * .18];
  return {
    d: `M${a[0]} ${a[1]} Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${b[0]} ${b[1]}`,
    at: u => [(1 - u) * (1 - u) * a[0] + 2 * u * (1 - u) * c[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * c[1] + u * u * b[1]]
  };
}

<script>
'use strict';
/* ==========================================================
 *  萌宠小花园 · 配乐与音效
 *  全部用 Web Audio 实时合成，原创旋律，不需要任何音频文件
 * ========================================================== */
const Sound = (function () {
  let ctx = null, master = null, musicGain = null, sfxGain = null;
  let on = true, cur = null, curName = null, timer = null;
  let mT = 0, bT = 0, mi = 0, bi = 0;

  const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

    const m = /^([A-G]#?)(\d)$/.exec(n);
    return m ? 440 * Math.pow(2, (SEMI[m[1]] + (+m[2] - 4) * 12 - 9) / 12) : 0;
  }
  function parse(s) { return s.trim().split(/\s+/).map(x => { const p = x.split(':'); return [p[0], +p[1]]; }); }

  /* 每首曲子：旋律 + 低音，各 32 拍循环 */
  const TRACKS = {
    // 小屋：温柔的摇摆
    home: { bpm: 78, wave: 'pluck', vol: .2,
      mel: parse('E4:1 G4:1 A4:1 G4:1 E4:1 D4:1 C4:2 D4:1 E4:1 G4:1 E4:1 D4:2 -:2 E4:1 G4:1 A4:1 C5:1 A4:1 G4:1 E4:2 D4:1 E4:1 D4:1 C4:1 C4:3 -:1'),
      bass: parse('C3:4 A2:4 G2:4 G2:4 C3:4 F2:4 G2:4 C3:4') },
    // 花园：阳光下蹦蹦跳跳
    garden: { bpm: 96, wave: 'pluck', vol: .2,
      mel: parse('G4:.5 A4:.5 C5:1 A4:.5 G4:.5 E4:1 G4:.5 A4:.5 G4:.5 E4:.5 D4:2 E4:.5 G4:.5 A4:1 C5:.5 D5:.5 C5:1 A4:.5 G4:.5 E4:.5 D4:.5 C4:2 ' +
        'C5:1 D5:.5 E5:.5 D5:1 C5:1 A4:.5 C5:.5 A4:.5 G4:.5 E4:2 G4:.5 A4:.5 C5:1 D5:.5 C5:.5 A4:1 G4:.5 E4:.5 D4:1 C4:2'),
      bass: parse('C3:2 G2:2 G2:2 G2:2 A2:2 F2:2 G2:2 C3:2 C3:2 G2:2 F2:2 C3:2 F2:2 G2:2 G2:2 C3:2') },
    // 游乐场：欢快的旋转木马
    play: { bpm: 112, wave: 'pluck', vol: .17,
      mel: parse('C5:.5 E5:.5 G5:.5 E5:.5 C5:.5 E5:.5 D5:1 B4:.5 D5:.5 G5:.5 D5:.5 B4:.5 D5:.5 C5:1 A4:.5 C5:.5 F5:.5 C5:.5 A4:.5 C5:.5 B4:.5 D5:.5 C5:1 G4:1 C5:1 -:1 ' +
        'E5:.5 E5:.5 D5:.5 C5:.5 D5:1 G4:1 E5:.5 E5:.5 D5:.5 C5:.5 A4:2 F5:.5 E5:.5 D5:.5 C5:.5 B4:.5 C5:.5 D5:1 C5:1 E5:1 C5:2'),
      bass: parse('C3:1 G3:1 C3:1 G3:1 G2:1 D3:1 G2:1 D3:1 F2:1 C3:1 G2:1 D3:1 C3:1 G2:1 C3:2 C3:1 G3:1 G2:1 D3:1 C3:1 G3:1 F2:1 C3:1 F2:1 C3:1 G2:1 D3:1 C3:1 G2:1 C3:2') },
    // 商店：轻快的小碎步
    shop: { bpm: 90, wave: 'pluck', vol: .2,
      mel: parse('E4:1 G4:.5 A4:1 G4:.5 E4:1 D4:1 F4:.5 G4:1 F4:.5 D4:1 E4:1 G4:.5 C5:1 B4:.5 A4:1 G4:2 -:2 A4:1 C5:.5 A4:1 G4:.5 E4:1 F4:1 A4:.5 G4:1 E4:.5 D4:1 E4:.5 D4:.5 C4:1 D4:1 E4:1 C4:3 -:1'),
      bass: parse('C3:4 G2:4 A2:4 G2:4 F2:4 G2:4 C3:2 G2:2 C3:4') },
    // 夜晚：摇篮曲
    night: { bpm: 58, wave: 'sine', vol: .2,
      mel: parse('E4:2 G4:2 D4:3 -:1 C4:2 E4:2 G3:3 -:1 A3:2 C4:2 E4:3 -:1 D4:2 B3:2 C4:4'),
      bass: parse('C3:4 G2:4 A2:4 E2:4 F2:4 C3:4 G2:4 C3:4') }
  };
  TRACKS.game = Object.assign({}, TRACKS.play, { bpm: 128 });
  // 手帐：和小屋同一段旋律，慢一点、低一点，像翻相册
  TRACKS.album = Object.assign({}, TRACKS.home, { bpm: 66, wave: 'sine' });

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;

      ctx = new AC();
      master = ctx.createGain(); master.gain.value = on ? 0.9 : 0; master.connect(ctx.destination);

    } catch (e) { ctx = null; }
  }

  function tone(f, t, dur, type, vol, dest, slideTo) {
    if (!ctx || !f) return;
    dur = Math.max(0.06, dur);
    if (type === 'pluck') {   // 像拇指琴一样：一下拨响，慢慢散开，上面叠一点点泛音

    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function schedule() {
    if (!ctx || !cur || ctx.state !== 'running') return;
    const now = ctx.currentTime, spb = 60 / cur.bpm;
    if (mT < now - 0.2 || bT < now - 0.2) { mT = bT = now + 0.1; mi = bi = 0; }
    while (mT < now + 0.4) {
      const n = cur.mel[mi];
      if (n[0] !== '-') tone(freq(n[0]), mT, n[1] * spb * 0.95, cur.wave, cur.vol, musicGain);
      mT += n[1] * spb; mi = (mi + 1) % cur.mel.length;
    }
    while (bT < now + 0.4) {
      const n = cur.bass[bi];
      if (n[0] !== '-') tone(freq(n[0]), bT, n[1] * spb * 0.9, 'sine', 0.15, musicGain);
      bT += n[1] * spb; bi = (bi + 1) % cur.bass.length;
    }
  }

  /* 环境音：白天偶尔有小鸟叫，夜里有蛐蛐声 */
  function ambient() {
    if (!ctx || !on || ctx.state !== 'running' || document.hidden) return;
    const t = ctx.currentTime + 0.05;
    if (curName === 'night') {
      if (Math.random() < .5) for (let i = 0; i < 5; i++) tone(4200, t + i * .09, .05, 'sine', .035, musicGain);
    } else if (curName === 'home' || curName === 'garden' || curName === 'play') {
      if (Math.random() < .3) { const b = 2300 + Math.random() * 900; for (let i = 0; i < 2 + (Math.random() * 3 | 0); i++) tone(b + i * 160, t + i * .13, .09, 'sine', .05, musicGain, b + 700 + i * 160); }
    }
  }
  setInterval(ambient, 2600);

  function music(name) {
    if (name === curName) return;
    curName = name; cur = name ? TRACKS[name] : null;
    mi = bi = 0; mT = bT = 0;
    if (!timer) timer = setInterval(schedule, 100);
  }

  function setOn(v) {
    on = !!v;
    if (ctx && master) master.gain.setTargetAtTime(on ? 0.9 : 0, ctx.currentTime, 0.05);
    if (!on && window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) { } }
  }

  const sfx = {
    click() { tone(660, T(), .08, 'triangle', .22); },
    pop() { tone(520, T(), .11, 'sine', .3, null, 900); },
    coin() { const t = T(); tone(988, t, .09, 'square', .1); tone(1319, t + .08, .2, 'square', .1); },
    eat() { const t = T(); for (let i = 0; i < 4; i++) tone(240 + (i % 2) * 50, t + i * .14, .09, 'sawtooth', .12); },
    water() { const t = T(); for (let i = 0; i < 7; i++) tone(800 + Math.random() * 700, t + i * .07, .11, 'sine', .14, null, 380); },
    ok() { const t = T(); [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .09, .22, 'triangle', .24)); },
    bad() { const t = T(); tone(330, t, .18, 'sawtooth', .1, null, 210); tone(220, t + .16, .3, 'sawtooth', .1, null, 140); },
    chirp() { const t = T(); for (let i = 0; i < 3; i++) tone(2000 + i * 300, t + i * .11, .09, 'sine', .18, null, 2800 + i * 200); },
    level() { const t = T(); [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * .11, .28, 'triangle', .26)); },
    bubble() { tone(300 + Math.random() * 500, T(), .12, 'sine', .14, null, 1300); },

let S = null;
function newState(type, name) {
  const inv = { apple: 2, water: 2 }; inv[PETS[type].fav] = 3;
  return {
    v: 2, pet: { type, name }, level: 1, exp: 0, coins: 60,
    stats: { hunger: 62, thirst: 68, clean: 74, happy: 70, energy: 86 },
    inv, seeds: { carrot: 2, lettuce: 2, tulip: 1 }, owned: [], wear: null, gear: {},
    floor: 1, furn: furnDefault(), wallPick: null, dishes: {}, cookbook: {}, home: null, pals: [],
    plots: [null, null, null, null, null, null],
    sleeping: false, last: Date.now(),
    trip: null, mail: [], cards: {}, cardLog: [], souv: {}, visitor: null, albumNew: false,
    daily: { day: 0, signed: false, prog: {}, claimed: {} }, streak: 0,
    sick: null, runaway: null, meds: {}, risk: { cold: 0, tummy: 0, throat: 0, fever: 0 }, sweet: 0, immune: 0, souvSeen: {},
    counters: { feed: 0, water: 0, harvest: 0, game: 0, bath: 0, pet: 0, trip: 0, guest: 0, cure: 0, move: 0 },
    gameLv: { math: 3, catch: 2, fly: 2, memory: 2, melody: 2, match: 2, chess: 1, gomoku: 2 },   // 小游戏等级：口算是年级，其余是 1 轻松 / 2 普通 / 3 挑战
    stickers: [], phrases: [], soundOn: true
  };
}
function save() {
  if (!S) return;
  S.last = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { }
}
function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d || !d.pet || !PETS[d.pet.type]) return null;
    const b = newState(d.pet.type, d.pet.name);
    const s = Object.assign({}, b, d);
    s.stats = Object.assign(b.stats, d.stats);
    s.counters = Object.assign(b.counters, d.counters);
    s.daily = Object.assign(b.daily, d.daily);
    if (!Array.isArray(s.plots) || s.plots.length !== 6) s.plots = b.plots;
    if (s.trip && !DESTS[s.trip.dest]) s.trip = null;
    if (s.sick && !ILLS[s.sick.type]) s.sick = null;
    s.risk = Object.assign({ cold: 0, tummy: 0, throat: 0, fever: 0 }, d.risk);
    if (!d.souvSeen) { s.souvSeen = {}; for (const k in s.souv) if (s.souv[k]) s.souvSeen[k] = 1; }   // 旧存档：以前拿到过的特产都算见过
    if (s.runaway && !ILLS[s.runaway.type]) s.runaway = null;
    if (!s.furn || !Array.isArray(s.furn.own) || !Array.isArray(s.furn.put)) s.furn = furnDefault();   // 旧存档：补上原来画在背景里的那几件家具
    s.furn.put = s.furn.put.filter(p => FURNS[p.id]);
    if (s.floor !== 2 && s.floor !== 0) s.floor = 1;
    s.furn.put.forEach(p => { if ((FURNS[p.id].car || p.id === 'parkmat') && p.f !== 0) p.f = 0; });   // 旧存档：小车和停车位从一楼搬到负一楼的车库
    if (!DESTS[s.home]) s.home = null;
    s.pals = (Array.isArray(s.pals) ? s.pals : []).filter(p => p && PETS[p.type] && p.type !== s.pet.type);
    if (!s.meds) s.meds = {};
    return s;
  } catch (e) { return null; }
}

  const el = document.createElement('div'); el.className = 'fx-float'; el.innerHTML = html;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  $('#fx').appendChild(el); setTimeout(() => el.remove(), 1250);
}
function flyIcon(name, x1, y1, x2, y2, cb) {
  const el = document.createElement('div'); el.className = 'fx-fly'; el.innerHTML = icon(name);
  $('#fx').appendChild(el);
  // 动画结束后才生效；如果页面在后台、动画不走，就靠定时器兜底，保证东西不会白白用掉
  let done = false;
  const finish = () => { if (done) return; done = true; el.remove(); cb && cb(); };
  setTimeout(finish, 900);
  if (!el.animate) { finish(); return; }
  const a = el.animate([
    { transform: `translate(${x1 - 20}px,${y1 - 20}px) scale(1.2)` },
    { transform: `translate(${(x1 + x2) / 2 - 20}px,${Math.min(y1, y2) - 90}px) scale(1.5)`, offset: .5 },
    { transform: `translate(${x2 - 20}px,${y2 - 20}px) scale(.5)` }
  ], { duration: 650, easing: 'ease-in-out' });
  a.onfinish = finish;
}
function confetti() {
  const cs = ['#EBAE9C', '#EBC66B', '#B9CFA0', '#A9CDD9', '#CBBBDD'];

    const el = document.createElement('i'); el.className = 'confetti';
    el.style.left = rand(0, 100) + 'vw'; el.style.background = pick(cs);

  }
}

function addCoins(n) {
  S.coins += n;
  const c = $('#hud-coin'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  Sound.sfx.coin(); updateHUD();
}
function addExp(n) {
  S.exp += n;
  let up = false;
  while (S.exp >= needExp(S.level)) { S.exp -= needExp(S.level); S.level++; S.coins += 20; up = true; }
  if (up) {
    Sound.sfx.level(); confetti();
    banner('长大啦！Lv.' + S.level + ' ' + levelTitle(S.level));
    setTimeout(() => toast('升级奖励：橡果 +20'), 2500);
    renderPet(true);
  }
}

let tempMood = null, tempTimer = null, petSig = '', sayTimer = null;
function calcMood() {
  if (S.sleeping) return 'sleep';
  if (tempMood) return tempMood;
  if (S.sick) return S.sick.type;
  const s = S.stats, mn = Math.min(s.hunger, s.thirst, s.clean, s.happy, s.energy);
  if (mn < 25) return 'sad';
  return (s.hunger + s.thirst + s.clean + s.happy + s.energy) / 5 >= 72 ? 'happy' : 'normal';
}
function renderPet(force) {
  const mood = calcMood(), sig = S.pet.type + '|' + mood + '|' + S.wear;
  if (!force && sig === petSig) return;
  petSig = sig;

/* ---------- 喂食：吃的、喝的、旅行带回来的特产 ---------- */

const noFoodHTML = '<p class="empty">食物吃光啦！<br>去商店买一些，或者去花园种出来吧~</p><div class="row"><button class="btn small" data-go="shop">去商店</button><button class="btn small green" data-go="garden">去花园</button></div>';

/* 第二个参数：不填是普通食物，true 是特产，'dish' 是自己煮的菜 */
function feed(id, isSouv) {

  const it = isDish ? DISHES[id] : isSouv ? SOUVS[id] : FOODS[id], stock = isDish ? S.dishes : isSouv ? S.souv : S.inv;

  if (S.stats[it.drink ? 'thirst' : 'hunger'] >= 96) { say(it.drink ? '喝得饱饱的，喝不下啦~' : '我吃得饱饱的，吃不下啦~'); return; }

    if (isDish) say(pick(['自己做的' + it.name + '，最好吃啦！', '热乎乎的，好香呀~']));
    else if (isSouv) say(pick(['是旅行带回来的' + it.name + '！真好吃~', '一尝就想起那次旅行啦~']));
    else if (PETS[S.pet.type].fav === id) { addStat('happy', 10); say('哇！是我最爱吃的' + it.name + '！'); }
    else say(it.drink ? pick(['咕嘟咕嘟，真解渴！', '好喝！谢谢你~']) : pick(['啊呜啊呜，真好吃！', '谢谢你，好香呀~', '吃饱饱，长高高！']));
    floatFx(icon(it.drink ? 'water' : 'bowl') + '+' + (it.drink ? it.thirst : it.hunger), pc.x, pc.r.top);
    S.counters.feed++; progress(it.drink ? 'drink' : 'feed'); addExp(isSouv || isDish ? 12 : 8); afterAction();

/* ---------- 生病、照顾和离家出走 ----------
 * 1. 某项状态太低 → 先出现症状，画面上方提示“再不处理，多久后会生病”
 * 2. SICK_AFTER 秒不处理 → 生病。生病时不能旅行、表演和玩小游戏
 * 3. 吃对症的药 + 休息 → 康复；万能药水可以马上治好
 * 4. 生病后 RUNAWAY_AFTER 秒一直不吃药（关掉游戏的时间也算）→ 离家出走，
 *    要带着药和它最爱的食物去接，接回来病就好了 */
const NO_RISK = () => ({ cold: 0, tummy: 0, throat: 0, fever: 0 });
/* 把秒数写成“2 分 30 秒”，按 5 秒取整，免得数字跳得太快 */
function fmtLeft(s) {
  s = Math.max(5, Math.ceil(s / 5) * 5);
  const m = Math.floor(s / 60), r = s % 60;
  return (m ? m + ' 分' : '') + (r ? (m ? ' ' : '') + r + ' 秒' : (m ? '钟' : ''));
}
/* 现在有没有“快要生病”的症状：有的话返回最紧急的那一种 */
function symptom() {
  if (!S || S.sick || gone() || S.immune > 0) return null;
  let best = null;
  for (const t in ILLS) {
    const ill = ILLS[t];
    if (S.stats[ill.stat] < ill.below) { const left = SICK_AFTER - (S.risk[t] || 0); if (!best || left < best.left) best = { type: t, left }; }
  }
  return best;
}
/* 画面上方的提醒条：症状、生病、离家出走三种情况都在这里说清楚还剩多久、该怎么办 */
function renderAlert() {
  const el = $('#alert'), name = esc(S.pet.name);
  let html = '', bad = false;
  if (S.runaway) { bad = true; html = `<b>${name} 离家出走了</b><span>带上药和它最爱吃的，去接它回家</span><button data-al="fetch">去接它</button>`; }
  else if (S.sick && !S.trip) {
    const k = S.sick, ill = ILLS[k.type]; bad = true;
    if (k.treated) html = `<b>${name} ${ill.name}</b><span>已经吃过药了，${ill.rest === 'sleep' ? '让它睡一觉就会好' : '再休息一会儿就会好'}</span>` + (ill.rest === 'sleep' && !S.sleeping ? '<button data-al="sleep">去睡觉</button>' : '');
    else html = `<b>${name} ${ill.name}</b><span>再不吃药，${fmtLeft(RUNAWAY_AFTER - k.age)}后它会离家出走</span><button data-al="med">去治疗</button>`;
  } else {
    const sy = symptom();
    if (sy) { const ill = ILLS[sy.type]; html = `<b>${name} ${ill.symptom}</b><span>${ill.cause}，再不${ill.fix}，${fmtLeft(sy.left)}后会${ill.short}</span><button data-al="${ill.act}">去${ill.fix}</button>`; }
  }
  if (bath || Games.active) html = '';   // 洗澡和玩小游戏时先不打扰
  if (el.dataset.h === html) return;
  el.dataset.h = html; el.innerHTML = html;
  el.classList.toggle('on', !!html); el.classList.toggle('bad', bad);
}
function alertAction(act) {
  Sound.sfx.click();
  if (act === 'fetch') { openFetch(); return; }

let symNow = null, symFx = 0;
function tickSick(dt) {
  if (gone()) { renderAlert(); return; }
  S.immune = Math.max(0, (S.immune || 0) - dt);
  S.sweet = Math.max(0, (S.sweet || 0) - dt / 120);   // 两分钟消化掉一份甜食
  const k = S.sick, st = S.stats;
  if (!k) {
    if (!Games.active && S.immune <= 0) {
      for (const t in ILLS) { const ill = ILLS[t]; S.risk[t] = st[ill.stat] < ill.below ? (S.risk[t] || 0) + dt : Math.max(0, (S.risk[t] || 0) - dt * 2); }
      const due = Object.keys(ILLS).filter(t => S.risk[t] >= SICK_AFTER)[0];
      if (due) { symNow = null; getSick(due); renderAlert(); return; }
    }
    const sy = symptom();
    if (sy && sy.type !== symNow && !Games.active) { const ill = ILLS[sy.type]; toast(S.pet.name + ' ' + ill.symptom + '：' + ill.cause + '，快' + ill.fix + '吧', 3800); Sound.sfx.pop(); }
    symNow = sy ? sy.type : null;
    if (sy && scene === 'home' && !S.sleeping && !bath && !modalOpen() && (symFx += dt) >= 6) {
      symFx = 0; const pc = petCenter(); floatFx(ILLS[sy.type].fx, pc.x, pc.r.top + 10);
    }
  } else {
    k.age += dt;
    if (k.treated) {
      if (ILLS[k.type].rest === 'sleep') { if (S.sleeping) k.rest += dt; if (k.rest >= 20) { S.sleeping = false; cure(); } }
      else { if (!Games.active) k.rest += dt; if (k.rest >= 30) cure(); }
    } else if (k.age >= RUNAWAY_AFTER) runAway();
  }
  if (S) renderAlert();
}

    card: dest + (rare ? ':b' : ':a'),

/* ---------- 小车、旅行地图和搬家 ---------- */

/* 新买的车直接停进负一楼的车库：按屏幕看得见的宽度一排停 2～4 辆，先靠墙停两排（在宠物身后），再停到前面 */
function parkCar(id) {
  const n = S.furn.put.filter(p => FURNS[p.id] && FURNS[p.id].car).length;
  const halfW = $('#stage').clientWidth / (2 * stageU), x0 = Math.max(0, 400 - halfW), x1 = Math.min(800, 400 + halfW);
  const per = clamp(Math.floor((x1 - x0) / 180), 2, 4), row = Math.floor(n / per) % 3;
  const p = { id, f: 0, x: x0 + (x1 - x0) * (n % per + .5) / per + (row === 1 ? 24 : 0), y: [404, 452, 498][row] };
  clampFurn(p); S.furn.put.push(p);
  renderFurn();
}
/* 旅行走到哪一步了：去的路上（go）、在那里玩（stay）、回家的路上（back）；u 是在路上的位置，0 是家，1 是目的地 */
function tripStage() {
  const t = S.trip, f = clamp((Date.now() - t.start) / 1000 * SPEED / t.dur, 0, 1), a = t.a || .42;
  return f < a ? { at: 'go', u: f / a } : f <= 1 - a ? { at: 'stay', u: 1 } : { at: 'back', u: (1 - f) / a };
}

    `<p class="album-note" style="margin:8px 0 0">已经去过 ${n} / ${Object.keys(DESTS).length} 个地方 · 点一个地方看看，去过的地方可以搬过去住</p>`;
}
/* 把地图上的宠物挪到它现在的位置（页面上有几张地图就挪几张）；center 表示顺便把地图滚到它那里 */

  if (S.runaway) { pos = MAP_FRIEND; text = S.pet.name + ' 在栗子家，等你去接它'; }
  else if (S.trip && MAP_AT[S.trip.dest]) {

    pos = r.at(st.u); d = r.d; car = t.car && FURNS[t.car] ? FURNS[t.car] : null;
    text = st.at === 'go' ? `${S.pet.name} ${car ? '开着' + car.name : '背着小包'}，正在去「${name}」的路上`

}

function harvest(i) {

function tickGarden(dt) {
  S.plots.forEach((p, i) => {
    if (!p || p.growth >= 100) return;
    if (p.water > 0) {
      p.growth = Math.min(100, p.growth + 100 / SEEDS[p.seed].time * dt);
      p.water = Math.max(0, p.water - 100 / 45 * dt);
      if (p.growth >= 100) {
        if (scene === 'garden') Sound.sfx.pop();

}

  const wearCard = k => card(WEARS[k].ic, WEARS[k].name, '给宠物戴上', '', WEARS[k].price, 'wear', k, S.owned.includes(k));
  const where = { floor: '放在地上', rug: '铺在地上', wall: '挂在墙上' };
